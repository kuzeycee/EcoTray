<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset = "UTF-8">
    <title>EcoTray</title>
    <style>
        body {
        margin: 0;
        }
        .panels{
        display: flex;
        }

        .left {
        background: cyan;
        flex: 4;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        }
        .right{
        background:orange;
        height: 100vh;
        flex: 3;
        display: flex;
        align-items:center;
        justify-content: center;
        color: white;
        font-size:32px;
        text-align: center;
        padding: 21px;
        }
        h1 {
        margin: 0;
        padding: 12px 20px;
        background: #222;
        color: white;
        font-size: 20px;
        }
       </style>
</head>
<body>
    <h1>EcoTray</h1>
    <div class = "panels">
        <div class = "left">Camera</div>
        <div class = "right">Please throw plastics into blue can.</div>
    </div>
<script>
    console.log("JavaScript is working!! yay");
    document.querySelector(".left").textContent = "cam will open in here.";
    document.querySelector(".right").addEventListener("click", function() {
    document.querySelector( ".right").textContent = "Thanks! Now plate is clear like your heart :))"
    });
</script>
</body>
</html>
