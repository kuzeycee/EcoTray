<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset = "UTF-8">
    <title>EcoTray</title>
    <style>
        body {
        margin: 0;
        }
        .panels{
        display: flex;
        }

        .left {
        background: cyan;
        flex: 4;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        }
        .right{
        background:orange;
        height: 100vh;
        flex: 3;
        display: flex;
        align-items:center;
        justify-content: center;
        color: white;
        font-size:32px;
        text-align: center;
        padding: 21px;
        }
        h1 {
        margin: 0;
        padding: 12px 20px;
        background: #222;
        color: white;
        font-size: 20px;
        }
       </style>
</head>
<body>
    <h1>EcoTray</h1>
    <div class = "panels">
        <div class = "left">Camera</div>
        <div class = "right">Please throw plastics into blue can.</div>
    </div>
<script>
    const camBox = document.querySelector(".left");

    navigator.mediaDevices.getUserMedia({video: true, audio: false})
    .then(function(stream)
    {
    const video = document.createElement("video");
    video.srcObject = stream;
    video.autoplay = true;
    video.playsInline = true;
    video.muted = true;

    camBox.textContent = "";
    camBox.appendChild(video);

    })
    .catch(function(err)
    {
        camBox.textContent = "Camera cannot be opened: " + err.name;
    });
</script>
</body>
</html>
